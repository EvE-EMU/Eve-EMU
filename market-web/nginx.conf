server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/market/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
