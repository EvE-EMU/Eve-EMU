[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-esi-forwarder"
version = "0.1.0"
description = "Alliance Auth 5 internal ESI token + proxy bridge for external apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aa_esi_forwarder*", "esi_forwarder_client*"]
