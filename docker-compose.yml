    command: ["celery", "-A", "eve_auth", "beat", "-l", "INFO"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve}
      POSTGRES_DB_AA: ${POSTGRES_DB_AA:-eve_emu_aa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AA_DJANGO_SECRET_KEY: ${AA_DJANGO_SECRET_KEY:-}
      AA_DEBUG: ${AA_DEBUG:-0}
      AA_INSTALL_AADISCORDBOT: "1"
      # Freight pilot Discord pings: sync courier contracts + notify (default 3 min)
      AA_BEAT_FREIGHT_SECONDS: ${AA_BEAT_FREIGHT_SECONDS:-180}
      MOONMINING_USE_REPROCESS_PRICING: ${MOONMINING_USE_REPROCESS_PRICING:-1}
      MOONMINING_PRICE_SOURCE: ${MOONMINING_PRICE_SOURCE:-janice_buy}
      MOONMINING_JANICE_API_KEY: ${MOONMINING_JANICE_API_KEY:-${MARKET_JANICE_API_KEY:-${BUYBACKPROGRAM_PRICE_JANICE_API_KEY:-}}}
      MARKET_JANICE_API_KEY: ${MARKET_JANICE_API_KEY:-${BUYBACKPROGRAM_PRICE_JANICE_API_KEY:-}}
      BUYBACKPROGRAM_PRICE_JANICE_API_KEY: ${BUYBACKPROGRAM_PRICE_JANICE_API_KEY:-${MARKET_JANICE_API_KEY:-}}
      INDY_HUB_SITE_URL: ${AA_SITE_URL:-https://auth.${DOMAIN_NAME:-eve-emu.com}}
      AA_RORQUAL_CELERY: ${AA_RORQUAL_CELERY:-1}
      AA_KRAB_CELERY: ${AA_KRAB_CELERY:-1}
      AA_RORQUAL_DISCORD: ${AA_RORQUAL_DISCORD:-0}
      AA_RORQUAL_ECONOMY: ${AA_RORQUAL_ECONOMY:-1}
      AA_RORQUAL_HELP: ${AA_RORQUAL_HELP:-0}
      AA_RORQUAL_HELP_DRY_RUN: ${AA_RORQUAL_HELP_DRY_RUN:-0}
      AA_RORQUAL_OPS_ALERTS: ${AA_RORQUAL_OPS_ALERTS:-1}
      AA_RORQUAL_INGEST_TOKEN: ${AA_RORQUAL_INGEST_TOKEN:-}
      ZOMBOID_DB_PATH: ${ZOMBOID_DB_PATH:-/zomboid-db/EveEmuZomboid.db}
      ZOMBOID_WORLD: ${ZOMBOID_WORLD:-EveEmuZomboid}
      ZOMBOID_SERVICE_URL: ${ZOMBOID_SERVICE_URL:-5.9.109.245:16261}
      <<: *aa-discord-environment
    volumes:
      - ./allianceauth:/opt/allianceauth:ro
      - ./deploy/aa_docker/rorqual_status:/app/deploy/aa_docker/rorqual_status
      - ./deploy/aa_docker/freight_bridge:/app/deploy/aa_docker/freight_bridge
      - ./deploy/aa_docker/penguin_bridge:/app/deploy/aa_docker/penguin_bridge
      - ./deploy/aa_docker/freight_public_api.py:/app/deploy/aa_docker/freight_public_api.py
      - ./deploy/aa_docker/freight_discord_reactions.py:/app/deploy/aa_docker/freight_discord_reactions.py
      - ./deploy/aa_docker/krab_schedule:/app/deploy/aa_docker/krab_schedule
      - ./deploy/aa_docker/local.py:/app/site/eve_auth/settings/local.py
      - ./deploy/aa_docker/eve_auth/celery.py:/app/site/eve_auth/celery.py
      - ./deploy/aa_docker/package_monitor_ops:/app/deploy/aa_docker/package_monitor_ops
      - ./deploy/aa_docker/industry_jobs_report:/app/deploy/aa_docker/industry_jobs_report
      - ./deploy/aa_docker/false_gods_audit:/app/deploy/aa_docker/false_gods_audit
      - ./deploy/aa_docker/audit_comms_hub:/app/deploy/aa_docker/audit_comms_hub
      - ./deploy/aa_docker/miningtaxes_summary_perf.py:/app/deploy/aa_docker/miningtaxes_summary_perf.py
      - ./deploy/aa_docker/miningtaxes_ext:/app/deploy/aa_docker/miningtaxes_ext
      - ./deploy/aa_docker/miningtaxes_structure_exclusions.py:/app/deploy/aa_docker/miningtaxes_structure_exclusions.py
      - ./deploy/aa_docker/miningtaxes_negative_balance_patch.py:/app/deploy/aa_docker/miningtaxes_negative_balance_patch.py
      - ./deploy/aa_docker/miningtaxes_ore_tax_rates_patch.py:/app/deploy/aa_docker/miningtaxes_ore_tax_rates_patch.py
      - ./deploy/aa_docker/miningtaxes_notify_patch.py:/app/deploy/aa_docker/miningtaxes_notify_patch.py
      - ./deploy/aa_docker/miningtaxes_unauth_miner_alert.py:/app/deploy/aa_docker/miningtaxes_unauth_miner_alert.py
      - ./deploy/aa_docker/extensions:/app/deploy/aa_docker/extensions
      - ./deploy/aa_docker/zomboid_service:/app/deploy/aa_docker/zomboid_service
      - ./deploy/aa_docker/requirements-aa-extension-apps.txt:/app/deploy/aa_docker/requirements-aa-extension-apps.txt
      - ./deploy/aa_docker/requirements-aa-extension-deps.txt:/app/deploy/aa_docker/requirements-aa-extension-deps.txt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Alliance Auth Discord bot (aadiscordbot: /8ball, /auth, name sync, etc.).
  # Do NOT run with emu-bot on the same DISCORD_BOT_TOKEN — slash commands overwrite each other.
  # Enable only with a separate Discord application token: docker compose --profile aa-discordbot up -d aa-discordbot
  aa-discordbot:
    profiles: [aa-discordbot]
    build:
      context: .
      dockerfile: docker/django-aa/Dockerfile
    entrypoint: ["python3", "/docker-entrypoint.py"]
    command:
      [
        "python",
        "/app/site/manage.py",
        "run_authbot",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve}
      POSTGRES_DB_AA: ${POSTGRES_DB_AA:-eve_emu_aa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AA_DJANGO_SECRET_KEY: ${AA_DJANGO_SECRET_KEY:-}
      AA_DEBUG: ${AA_DEBUG:-0}
      AA_SITE_URL: ${AA_SITE_URL:-https://auth.${DOMAIN_NAME:-eve-emu.com}}
      AA_INSTALL_AADISCORDBOT: "1"
      <<: *aa-discord-environment
    volumes:
      - ./allianceauth:/opt/allianceauth:ro
      - ./deploy/aa_docker/rorqual_status:/app/deploy/aa_docker/rorqual_status
      - ./deploy/aa_docker/freight_bridge:/app/deploy/aa_docker/freight_bridge
      - ./deploy/aa_docker/penguin_bridge:/app/deploy/aa_docker/penguin_bridge
      - ./deploy/aa_docker/freight_public_api.py:/app/deploy/aa_docker/freight_public_api.py
      - ./deploy/aa_docker/freight_discord_reactions.py:/app/deploy/aa_docker/freight_discord_reactions.py
      - ./deploy/aa_docker/krab_schedule:/app/deploy/aa_docker/krab_schedule
      - ./deploy/aa_docker/local.py:/app/site/eve_auth/settings/local.py
      - ./deploy/aa_docker/eve_auth/celery.py:/app/site/eve_auth/celery.py
      - ./deploy/aa_docker/package_monitor_ops:/app/deploy/aa_docker/package_monitor_ops
      - ./deploy/aa_docker/industry_jobs_report:/app/deploy/aa_docker/industry_jobs_report
      - ./deploy/aa_docker/false_gods_audit:/app/deploy/aa_docker/false_gods_audit
      - ./deploy/aa_docker/audit_comms_hub:/app/deploy/aa_docker/audit_comms_hub
      - ./deploy/aa_docker/miningtaxes_summary_perf.py:/app/deploy/aa_docker/miningtaxes_summary_perf.py
      - ./deploy/aa_docker/miningtaxes_ext:/app/deploy/aa_docker/miningtaxes_ext
      - ./deploy/aa_docker/miningtaxes_structure_exclusions.py:/app/deploy/aa_docker/miningtaxes_structure_exclusions.py
      - ./deploy/aa_docker/miningtaxes_negative_balance_patch.py:/app/deploy/aa_docker/miningtaxes_negative_balance_patch.py
      - ./deploy/aa_docker/miningtaxes_ore_tax_rates_patch.py:/app/deploy/aa_docker/miningtaxes_ore_tax_rates_patch.py
      - ./deploy/aa_docker/miningtaxes_notify_patch.py:/app/deploy/aa_docker/miningtaxes_notify_patch.py
      - ./deploy/aa_docker/miningtaxes_unauth_miner_alert.py:/app/deploy/aa_docker/miningtaxes_unauth_miner_alert.py
      - ./deploy/aa_docker/extensions:/app/deploy/aa_docker/extensions
      - ./deploy/aa_docker/requirements-aa-extension-apps.txt:/app/deploy/aa_docker/requirements-aa-extension-apps.txt
      - ./deploy/aa_docker/requirements-aa-extension-deps.txt:/app/deploy/aa_docker/requirements-aa-extension-deps.txt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      aa-web:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  # =====================================================================
  # Observability (Phase 2, self-hosted per 2026-09-13 direction) — errors.
  # {$SITE_HOST} and grafana.{$SITE_HOST}. Both share the existing db/redis
  # containers (own database / redis db index) rather than standing up
  # dedicated postgres+redis per service.
  # =====================================================================

  # Sentry-SDK-compatible error tracking. Modern GlitchTip (v6+) is a single
  # process — the image's own bin/start.sh serves HTTP, consumes the task
  # queue, and runs the scheduler together; there is deliberately no
  # separate worker/beat container to run (see glitchtip-backend's
  # bin/run-worker.sh, which now refuses to start standalone).
  glitchtip:
    image: glitchtip/glitchtip:v6.0.3
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-eve}:${POSTGRES_PASSWORD:-eve}@db:5432/glitchtip
      VALKEY_URL: redis://redis:6379/6
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set a random secret in .env — see .env.example}
      GLITCHTIP_DOMAIN: https://errors.${DOMAIN_NAME:-eve-emu.com}
      ALLOWED_HOSTS: errors.${DOMAIN_NAME:-eve-emu.com}
      CSRF_TRUSTED_ORIGINS: https://errors.${DOMAIN_NAME:-eve-emu.com}
      DEBUG: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-alerts@eve-emu.com}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      eve_emu_edge:
        aliases:
          - prod-glitchtip

  # Log storage/query engine — monolithic single-node mode (filesystem
  # storage, tsdb index), not the read/write/backend split meant for
  # multi-tenant scale. 30-day retention (compactor below) so this doesn't
  # repeat the unbounded-growth mistake docker's own json-file logs had
  # before today.
  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - eve_emu_loki_data:/loki
    expose:
      - "3100"
    networks:
      - default

  # Ships every container's docker logs to Loki via the Docker API (service
  # discovery — no need to list containers by name, new ones are picked up
  # automatically). Promtail itself is in maintenance mode upstream (Grafana
  # Alloy is the eventual successor) but still fully supported for this —
  # simpler config, and this is exactly the well-trodden use case.
  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - default

  # Log/metrics UI — grafana.{$SITE_HOST}. Loki wired in automatically via
  # provisioning (docker/grafana/provisioning/), no manual "add data source"
  # click needed on first boot.
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a real password in .env — see .env.example}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN_NAME:-eve-emu.com}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - eve_emu_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    expose:
      - "3000"
    networks:
      default: {}
      eve_emu_edge:
        aliases:
          - prod-grafana

volumes:
  eve_emu_pgdata: {}
  eve_emu_image_cache: {}
  eve_emu_redis: {}
  eve_emu_aa_static: {}
  eve_emu_aa_oidc: {}
  eve_emu_mediawiki_db: {}
  eve_emu_mediawiki_images: {}
  eve_emu_mediawiki_es: {}
  eve_emu_caddy_data: {}
  eve_emu_caddy_config: {}
  eve_emu_pelican_data: {}
  eve_emu_pelican_logs: {}
  market_sde_data: {}
  eve_emu_loki_data: {}
  eve_emu_grafana_data: {}

networks:
  eve_emu_edge:
    name: eve_emu_edge
    driver: bridge
